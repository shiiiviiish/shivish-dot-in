<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shivish — Mask Effect</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; cursor: none; }
    body { background: #080d0a; font-family: 'DM Sans', sans-serif; color: #fff; overflow: hidden; display: flex; align-items: center; justify-content: center; }

    #cursor { position: fixed; width: 12px; height: 12px; background: #fff; border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%,-50%); mix-blend-mode: difference; transition: width 0.2s, height 0.2s; }
    #cursor-trail { position: fixed; width: 40px; height: 40px; border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%,-50%); }

    #fogCanvas { position: fixed; inset: 0; z-index: 0; }

    .scene { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }

    .face-wrap {
      position: relative;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      overflow: hidden;
      cursor: none;
    }

    .face-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      border-radius: 50%;
      filter: saturate(0.9);
      transition: filter 0.3s;
    }

    .mask-img {
      position: absolute;
      width: 85%;
      height: 85%;
      object-fit: contain;
      left: 50%;
      top: 55%;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s cubic-bezier(0.16,1,0.3,1), transform 0.4s cubic-bezier(0.16,1,0.3,1), filter 0.4s;
      filter: drop-shadow(0 0 20px rgba(100,200,150,0.4)) brightness(1.1);
      mix-blend-mode: multiply;
    }

    .face-wrap.active .mask-img {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .face-wrap.active .face-img {
      filter: saturate(0.5) brightness(0.8);
    }

    /* Glow ring around face */
    .face-ring {
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 2px solid rgba(100,200,150,0);
      transition: border-color 0.4s, box-shadow 0.4s;
      pointer-events: none;
      z-index: 2;
    }
    .face-wrap.active .face-ring {
      border-color: rgba(100,200,150,0.4);
      box-shadow: 0 0 30px rgba(100,200,150,0.2), inset 0 0 30px rgba(100,200,150,0.1);
    }

    /* Scan line effect */
    .scan-line {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(100,200,150,0.6), transparent);
      top: -100%;
      opacity: 0;
      pointer-events: none;
      z-index: 3;
      transition: opacity 0.3s;
    }
    .face-wrap.active .scan-line {
      opacity: 1;
      animation: scan 1.5s ease-in-out infinite;
    }
    @keyframes scan { 0%{top:-10%}100%{top:110%} }

    .hero-text { text-align: center; }
    .hero-tag { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 12px; }
    .hero-name { font-family: 'Instrument Serif', serif; font-size: 56px; font-weight: 400; line-height: 0.95; letter-spacing: -0.03em; }
    .hero-name em { font-style: italic; color: rgba(255,255,255,0.3); }
    .hero-hint { font-size: 13px; color: rgba(255,255,255,0.35); margin-top: 12px; letter-spacing: 0.05em; }

    /* HUD elements that appear on hover */
    .hud { position: absolute; opacity: 0; transition: opacity 0.4s; pointer-events: none; font-size: 10px; letter-spacing: 0.1em; color: rgba(100,200,150,0.7); font-family: 'DM Sans', monospace; }
    .face-wrap.active .hud { opacity: 1; }
    .hud-tl { top: 20px; left: 20px; }
    .hud-tr { top: 20px; right: 20px; text-align: right; }
    .hud-bl { bottom: 20px; left: 20px; }
    .hud-br { bottom: 20px; right: 20px; text-align: right; }
  </style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-trail"></div>
<canvas id="fogCanvas"></canvas>

<div class="scene">
  <div class="face-wrap" id="faceWrap">
    <img class="face-img" src="src/images/shivishanimated.png" alt="Shivish"/>
    <img class="mask-img" id="maskImg" src="src/images/cyperpunkmask.png" alt="Mask"/>
    <div class="face-ring"></div>
    <div class="scan-line"></div>
    <div class="hud hud-tl">SYS.ONLINE<br>ID:SHV-001</div>
    <div class="hud hud-tr">VIBE<br>CODER</div>
    <div class="hud hud-bl">LDH.IN</div>
    <div class="hud hud-br">V1.0.0</div>
  </div>

  <div class="hero-text">
    <p class="hero-tag">Hover to equip</p>
    <h1 class="hero-name">Shivish<br><em>vibe coder.</em></h1>
    <p class="hero-hint">Move cursor over face</p>
  </div>
</div>

<script>
// FOG
const canvas = document.getElementById('fogCanvas');
const ctx = canvas.getContext('2d');
let W, H, particles = [];
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
function makeP(){return{x:Math.random()*W,y:Math.random()*H,r:Math.random()*280+100,dx:(Math.random()-0.5)*0.22,dy:(Math.random()-0.5)*0.1,alpha:Math.random()*0.055+0.015,warm:Math.random()>0.5};}
resize();particles=Array.from({length:18},makeP);
function drawFog(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#080d0a';ctx.fillRect(0,0,W,H);
  for(const p of particles){
    const c=p.warm?'100,180,130':'60,140,110';
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
    g.addColorStop(0,`rgba(${c},${p.alpha})`);g.addColorStop(1,`rgba(${c},0)`);
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    p.x+=p.dx;p.y+=p.dy;
    if(p.x<-p.r)p.x=W+p.r;if(p.x>W+p.r)p.x=-p.r;
    if(p.y<-p.r)p.y=H+p.r;if(p.y>H+p.r)p.y=-p.r;
  }
  requestAnimationFrame(drawFog);
}
drawFog();
window.addEventListener('resize',resize);

// CURSOR
const cursor = document.getElementById('cursor');
const trail = document.getElementById('cursor-trail');
let mX=0,mY=0,tX=0,tY=0;
document.addEventListener('mousemove',e=>{mX=e.clientX;mY=e.clientY;cursor.style.left=mX+'px';cursor.style.top=mY+'px';});
function animTrail(){tX+=(mX-tX)*0.1;tY+=(mY-tY)*0.1;trail.style.left=tX+'px';trail.style.top=tY+'px';requestAnimationFrame(animTrail);}
animTrail();

// MASK EFFECT — mouse proximity to face
const faceWrap = document.getElementById('faceWrap');
const maskImg = document.getElementById('maskImg');

document.addEventListener('mousemove', e => {
  const rect = faceWrap.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
  const radius = rect.width / 2;

  if(dist < radius + 40) {
    faceWrap.classList.add('active');
    cursor.style.width = '20px';
    cursor.style.height = '20px';

    // Mask follows mouse slightly
    const dx = (e.clientX - cx) * 0.06;
    const dy = (e.clientY - cy) * 0.06;
    maskImg.style.marginLeft = dx + 'px';
    maskImg.style.marginTop = dy + 'px';
  } else {
    faceWrap.classList.remove('active');
    cursor.style.width = '12px';
    cursor.style.height = '12px';
    maskImg.style.marginLeft = '0';
    maskImg.style.marginTop = '0';
  }
});
</script>
</body>
</html>
